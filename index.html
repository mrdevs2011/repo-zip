<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>repo-zip</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292f'/%3E%3Cpath d='M16 7v9m0 0-4-4m4 4 4-4' stroke='%23ffffff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M9 20h14v5H9z' stroke='%23ffffff' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --canvas:#f6f8fa;
    --border:#d1d9e0;
    --fg:#1f2328;
    --fg-muted:#59636e;
    --accent:#0969da;
    --success:#1f883d;
    --success-hover:#1a7f37;
    --success-fg:#ffffff;
    --danger:#d1242f;
    --btn-bg:#f6f8fa;
    --btn-border:#d1d9e0;
    --btn-hover-bg:#f3f4f6;
    --header-bg:#24292f;
    --neutral-muted:#818b981f;
    --shadow:0 1px 0 rgba(31,35,40,.04);
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--canvas);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
    font-size:14px;
    line-height:1.5;
  }

  header{
    background:var(--header-bg);
    padding:16px 24px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header .logo{ width:32px; height:32px; flex-shrink:0; }
  header .brand{ color:#fff; font-size:16px; font-weight:600; }
  header .brand small{ display:block; color:#9198a1; font-size:11px; font-weight:400; }

  .page{ max-width:600px; margin:0 auto; padding:32px 16px 64px; }

  .box{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .box-header{
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--canvas);
    border-radius:var(--radius) var(--radius) 0 0;
    font-size:14px;
    font-weight:600;
  }
  .box-body{ padding:16px; }

  label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--fg);
    margin:16px 0 6px;
  }
  label:first-child{ margin-top:0; }
  label .hint{ font-weight:400; color:var(--fg-muted); font-size:12px; }

  input[type=text], input[type=password], select{
    width:100%;
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--fg);
    padding:5px 12px;
    font-size:14px;
    line-height:20px;
    height:32px;
    font-family:inherit;
    outline:none;
    box-shadow:inset 0 1px 0 rgba(208,215,222,.2);
  }
  input:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px #0969da33;
  }
  input::placeholder{ color:#818b98; }
  select{ margin-top:6px; padding-right:28px; cursor:pointer; }

  #recentList{ display:none; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #recentList.show{ display:flex; }
  .chip{
    background:#ddf4ff;
    color:var(--accent);
    border:1px solid #54aeff66;
    border-radius:2em;
    padding:2px 10px;
    font-size:12px;
    font-weight:500;
    cursor:pointer;
  }
  .chip:hover{ background:#b6e3ff; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    height:32px;
    padding:0 16px;
    border-radius:var(--radius);
    border:1px solid var(--btn-border);
    background:var(--btn-bg);
    color:var(--fg);
    font-size:14px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
    box-shadow:var(--shadow);
    margin-top:16px;
  }
  .btn:hover{ background:var(--btn-hover-bg); border-color:#1f232833; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }

  .btn-primary{
    background:var(--success);
    border-color:rgba(31,35,40,.15);
    color:var(--success-fg);
  }
  .btn-primary:hover{ background:var(--success-hover); }

  .btn-sm{ width:auto; height:28px; padding:0 12px; font-size:12px; margin-top:0; }

  #previewInfo{
    display:none;
    font-size:12px;
    color:var(--fg-muted);
    margin-top:10px;
    padding:10px 12px;
    background:var(--canvas);
    border:1px solid var(--border);
    border-radius:var(--radius);
    line-height:1.7;
  }
  #previewInfo.show{ display:block; }
  #previewInfo .num{ color:var(--fg); font-weight:600; }
  #previewInfo .warn{ color:var(--danger); font-weight:600; }

  #downloadCard{
    display:none;
    align-items:center;
    gap:12px;
    margin-top:16px;
    padding:12px;
    background:var(--canvas);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  #downloadCard.show{ display:flex; }
  .zip-ic{ flex-shrink:0; width:32px; height:32px; color:var(--fg-muted); }
  .dl-info{ flex:1; min-width:0; }
  .dl-name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dl-size{ font-size:12px; color:var(--fg-muted); }

  #shareBtn{ display:none; }
  #shareBtn.show{ display:inline-flex; }
  #shareResult{ display:none; gap:6px; margin-top:8px; }
  #shareResult.show{ display:flex; }
  #shareUrlOutput{ flex:1; font-size:12px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; background:var(--canvas); }
  #shareResult .btn{ width:auto; margin-top:0; }

  .bar{ height:6px; background:var(--neutral-muted); border-radius:3px; margin-top:14px; display:none; overflow:hidden; }
  .bar.show{ display:block; }
  .bar-fill{ height:100%; width:0%; background:var(--success); transition:width .2s; }

  #log{
    display:none;
    margin-top:16px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#f6f8fa;
    padding:10px 12px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:12px;
    line-height:1.8;
    max-height:220px;
    overflow-y:auto;
  }
  #log.show{ display:block; }
  .l{ color:var(--fg-muted); white-space:pre-wrap; word-break:break-all; }
  .l.ok{ color:var(--success); }
  .l.err{ color:var(--danger); }

  /* advanced */
  .advanced-toggle{
    display:inline-block;
    margin-top:18px;
    font-size:12px;
    color:var(--fg-muted);
    cursor:pointer;
    text-decoration:none;
    border-bottom:1px dashed var(--border);
  }
  .advanced-toggle:hover{ color:var(--accent); border-color:var(--accent); }
  #advancedPanel{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  #advancedPanel.show{ display:block; }
  #advancedPanel label:first-child{ margin-top:0; }
  #advancedPanel .row{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--fg-muted); }
  #advancedPanel .row input[type=checkbox]{ accent-color:var(--accent); width:16px; height:16px; margin:0; }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M16 7v9m0 0-4-4m4 4 4-4" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M9 20h14v5H9z" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round"/>
  </svg>
  <div class="brand">repo-zip<small>GitHub repolarini bitta zip qilib yuklab olish</small></div>
</header>

<div class="page">
  <div class="box">
    <div class="box-header">Repository</div>
    <div class="box-body">
      <label>Repo URL</label>
      <input type="text" id="urlInput" placeholder="https://github.com/owner/repo" />
      <div id="recentList"></div>

      <!-- birinchi marta kirgan userda token maydoni shu yerda ko'rinadi -->
      <div id="tokenGroupPrimary"></div>

      <button id="goBtn" class="btn btn-primary" onclick="startDownload()">Download ZIP</button>

      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>

      <div id="downloadCard">
        <svg class="zip-ic" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h5.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v8.586A1.75 1.75 0 0 1 12.25 15h-8.5A1.75 1.75 0 0 1 2 13.25Zm7 3.5V1.5H3.75a.25.25 0 0 0-.25.25v11.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25V5.5H9.75A.75.75 0 0 1 9 4.75ZM6 6.5h1v1H6Zm1 2H6v1h1Zm-1 2h1v1H6Z"></path></svg>
        <div class="dl-info">
          <div class="dl-name" id="dlName"></div>
          <div class="dl-size" id="dlSize"></div>
        </div>
        <button id="dlBtn" class="btn btn-sm btn-primary" onclick="triggerDownload()">Yuklash</button>
      </div>

      <button id="shareBtn" class="btn btn-sm" style="margin-top:8px;width:100%;" onclick="uploadForShare()">Ulashish uchun url olish</button>
      <div id="shareResult">
        <input type="text" id="shareUrlOutput" readonly />
        <button class="btn btn-sm" onclick="copyShareUrl()">Copy</button>
      </div>

      <div id="log"></div>

      <a class="advanced-toggle" id="advancedToggle" onclick="toggleAdvanced()">Advanced</a>
      <div id="advancedPanel">
        <!-- token allaqachon saqlangan bo'lsa, tahrirlash uchun shu yerga ko'chadi -->
        <div id="tokenGroupAdvanced"></div>

        <label>Branch</label>
        <select id="branchInput"><option value="">auto branch</option></select>

        <label>Chiqarib tashlash <span class="hint">— vergul bilan ajrating</span></label>
        <input type="text" id="excludeInput" value="node_modules, .git, dist, build, .next, __pycache__, vendor" />

        <button id="previewBtn" class="btn" onclick="previewRepo()">Oldindan ko'rish</button>
        <div id="previewInfo"></div>
      </div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDagBXJ3r8DSXa7YdGCrMBYc4_J8U7GyNw",
  authDomain: "zipper-b1338.firebaseapp.com",
  projectId: "zipper-b1338",
  storageBucket: "zipper-b1338.firebasestorage.app",
  messagingSenderId: "1063584113151",
  appId: "1:1063584113151:web:83ad384da9b930b864c7ca",
  measurementId: "G-WNL24DQ3KL"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const logEl = document.getElementById('log');
const barEl = document.getElementById('bar');
const barFill = document.getElementById('barFill');
const btn = document.getElementById('goBtn');
const shareBtn = document.getElementById('shareBtn');
const shareResult = document.getElementById('shareResult');
const shareUrlOutput = document.getElementById('shareUrlOutput');
const downloadCard = document.getElementById('downloadCard');
const dlName = document.getElementById('dlName');
const dlSize = document.getElementById('dlSize');

const TOKEN_STORAGE_KEY = 'repo_zip_gh_token';
let lastZipBlob = null;
let lastZipName = '';
let lastZipMeta = null;

/* ---------- token field: primary (1-marta) vs advanced (keyingi safar) ---------- */
let tokenInput;
(function setupTokenField(){
  let savedToken = '';
  try{ savedToken = localStorage.getItem(TOKEN_STORAGE_KEY) || ''; }catch(e){}

  const group = document.createElement('div');
  group.innerHTML =
    '<label>Access token <span class="hint">— private repo yoki rate limit uchun, ixtiyoriy</span></label>' +
    '<input type="password" id="tokenInput" placeholder="ghp_..." />';

  const target = savedToken ? document.getElementById('tokenGroupAdvanced') : document.getElementById('tokenGroupPrimary');
  target.appendChild(group);

  tokenInput = document.getElementById('tokenInput');
  tokenInput.value = savedToken;

  tokenInput.addEventListener('input', () => {
    try{
      const v = tokenInput.value.trim();
      if(v){ localStorage.setItem(TOKEN_STORAGE_KEY, v); }
      else{ localStorage.removeItem(TOKEN_STORAGE_KEY); }
    }catch(e){}
  });
})();

function toggleAdvanced(){
  document.getElementById('advancedPanel').classList.toggle('show');
}

/* ---------- recent repos ---------- */
const RECENT_STORAGE_KEY = 'repo_zip_recent';
const recentListEl = document.getElementById('recentList');

function getRecent(){
  try{ return JSON.parse(localStorage.getItem(RECENT_STORAGE_KEY) || '[]'); }
  catch(e){ return []; }
}

function saveRecent(owner, repo, url){
  try{
    let list = getRecent();
    list = list.filter(item => item.url !== url);
    list.unshift({ owner, repo, url });
    list = list.slice(0, 6);
    localStorage.setItem(RECENT_STORAGE_KEY, JSON.stringify(list));
    renderRecent();
  }catch(e){}
}

function renderRecent(){
  const list = getRecent();
  recentListEl.innerHTML = '';
  if(list.length === 0){ recentListEl.classList.remove('show'); return; }
  list.forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.owner + '/' + item.repo;
    chip.onclick = () => {
      document.getElementById('urlInput').value = item.url;
      previewInfo.classList.remove('show');
    };
    recentListEl.appendChild(chip);
  });
  recentListEl.classList.add('show');
}
renderRecent();

function log(msg, cls){
  logEl.classList.add('show');
  const line = document.createElement('div');
  line.className = 'l ' + (cls || '');
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function parseRepoUrl(url){
  url = url.trim().replace(/\.git$/, '').replace(/\/$/, '');
  const m = url.match(/github\.com\/([^\/]+)\/([^\/]+)/i);
  if(!m) return null;
  return { owner: m[1], repo: m[2] };
}

function authHeaders(token){
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

async function ghFetch(url, token){
  const res = await fetch(url, { headers: authHeaders(token) });
  if(res.status === 401) throw new Error("token noto'g'ri yoki muddati o'tgan");
  if(res.status === 404) throw new Error("repo topilmadi (private bo'lsa token kerak)");
  if(res.status === 403){
    const remaining = res.headers.get('x-ratelimit-remaining');
    throw new Error('rate limit tugadi, qolgan: ' + remaining);
  }
  if(!res.ok) throw new Error('http ' + res.status);
  return res.json();
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function triggerDownload(){
  if(!lastZipBlob) return;
  const dlUrl = URL.createObjectURL(lastZipBlob);
  const a = document.createElement('a');
  a.href = dlUrl; a.download = lastZipName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(dlUrl);
  log('yuklab olindi: ' + lastZipName, 'ok');
}

function b64ToArrayBuffer(base64){
  const binary = atob(base64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function getExcludeParts(){
  const excludeRaw = document.getElementById('excludeInput').value;
  return excludeRaw.split(',').map(s => s.trim()).filter(Boolean);
}

function isExcluded(path, excludeParts){
  const segments = path.split('/');
  return excludeParts.some(pattern => segments.includes(pattern));
}

const previewBtn = document.getElementById('previewBtn');
const previewInfo = document.getElementById('previewInfo');

async function previewRepo(){
  const raw = document.getElementById('urlInput').value;
  const branchOverride = document.getElementById('branchInput').value;
  const token = tokenInput.value.trim();
  const parsed = parseRepoUrl(raw);
  if(!parsed){ previewInfo.classList.add('show'); previewInfo.innerHTML = '<span class="warn">noto\'g\'ri url</span>'; return; }

  previewBtn.disabled = true;
  previewBtn.textContent = "tekshirilmoqda...";
  previewInfo.classList.remove('show');

  try{
    let branch = branchOverride;
    if(!branch){
      const repoInfo = await ghFetch('https://api.github.com/repos/' + parsed.owner + '/' + parsed.repo, token);
      branch = repoInfo.default_branch;
    }

    try{
      const branches = await ghFetch('https://api.github.com/repos/' + parsed.owner + '/' + parsed.repo + '/branches?per_page=100', token);
      const branchSelect = document.getElementById('branchInput');
      const prevValue = branchOverride || branch;
      branchSelect.innerHTML = '<option value="">auto branch (' + branch + ')</option>';
      branches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.name;
        opt.textContent = b.name;
        if(b.name === prevValue) opt.selected = true;
        branchSelect.appendChild(opt);
      });
    }catch(e){}

    const tree = await ghFetch('https://api.github.com/repos/' + parsed.owner + '/' + parsed.repo + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1', token);

    const excludeParts = getExcludeParts();
    const allFiles = tree.tree.filter(item => item.type === 'blob');
    const kept = allFiles.filter(f => !isExcluded(f.path, excludeParts));
    const excludedCount = allFiles.length - kept.length;
    const totalSize = kept.reduce((sum, f) => sum + (f.size || 0), 0);

    let html = 'branch: <span class="num">' + branch + '</span><br>';
    html += 'jami: <span class="num">' + allFiles.length + '</span> fayl';
    if(excludedCount > 0) html += ', filtrdan keyin: <span class="num">' + kept.length + '</span> fayl (' + excludedCount + ' ta chiqarib tashlandi)';
    html += '<br>taxminiy hajm: <span class="num">~' + formatSize(totalSize) + '</span> (siqilmagan holda)';
    if(tree.truncated) html += '<br><span class="warn">ogohlantirish: repo katta, ro\'yxat kesilgan bo\'lishi mumkin</span>';

    previewInfo.innerHTML = html;
    previewInfo.classList.add('show');
  }catch(e){
    previewInfo.innerHTML = '<span class="warn">xato: ' + e.message + '</span>';
    previewInfo.classList.add('show');
  }finally{
    previewBtn.disabled = false;
    previewBtn.textContent = "oldindan ko'rish";
  }
}

async function startDownload(){
  const raw = document.getElementById('urlInput').value;
  const branchOverride = document.getElementById('branchInput').value;
  const token = tokenInput.value.trim();
  logEl.innerHTML = '';
  barEl.classList.remove('show');
  barFill.style.width = '0%';
  shareBtn.classList.remove('show');
  shareResult.classList.remove('show');
  downloadCard.classList.remove('show');
  lastZipBlob = null;

  const parsed = parseRepoUrl(raw);
  if(!parsed){ log("noto'g'ri url", 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'yuklanmoqda...';

  try{
    log('repo: ' + parsed.owner + '/' + parsed.repo);

    let branch = branchOverride;
    if(!branch){
      const repoInfo = await ghFetch('https://api.github.com/repos/' + parsed.owner + '/' + parsed.repo, token);
      branch = repoInfo.default_branch;
    }
    log('branch: ' + branch);

    const tree = await ghFetch('https://api.github.com/repos/' + parsed.owner + '/' + parsed.repo + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1', token);
    if(tree.truncated) log("ogohlantirish: repo katta, ba'zi fayllar tushib qolishi mumkin", 'err');

    const excludeParts = getExcludeParts();
    const allFiles = tree.tree.filter(item => item.type === 'blob');
    const excludedCount = allFiles.filter(f => isExcluded(f.path, excludeParts)).length;
    const files = allFiles.filter(f => !isExcluded(f.path, excludeParts));
    log(allFiles.length + ' ta fayl topildi');
    if(excludedCount > 0) log(excludedCount + " ta fayl filtr bo'yicha chiqarib tashlandi");
    if(files.length === 0){ log("fayl yo'q", 'err'); btn.disabled = false; btn.textContent = 'Download ZIP'; return; }

    barEl.classList.add('show');
    const zip = new JSZip();
    let done = 0;
    const concurrency = 6;
    const maxRetries = 3;
    let index = 0;

    function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

    async function fetchFileOnce(file){
      if(token){
        const blobRes = await fetch('https://api.github.com/repos/' + parsed.owner + '/' + parsed.repo + '/git/blobs/' + file.sha, { headers: authHeaders(token) });
        if(!blobRes.ok) throw new Error('http ' + blobRes.status);
        const blobData = await blobRes.json();
        return b64ToArrayBuffer(blobData.content);
      } else {
        const rawUrl = 'https://raw.githubusercontent.com/' + parsed.owner + '/' + parsed.repo + '/' + branch + '/' + file.path;
        const res = await fetch(rawUrl);
        if(!res.ok) throw new Error('http ' + res.status);
        return await res.arrayBuffer();
      }
    }

    async function worker(){
      while(index < files.length){
        const file = files[index++];
        let lastErr = null;
        let ok = false;
        for(let attempt = 0; attempt <= maxRetries; attempt++){
          try{
            const data = await fetchFileOnce(file);
            zip.file(file.path, data);
            ok = true;
            break;
          }catch(e){
            lastErr = e;
            if(attempt < maxRetries) await sleep(400 * (attempt + 1));
          }
        }
        if(!ok){
          log(file.path + ' - skip, ' + (maxRetries+1) + " urinishdan keyin (" + lastErr.message + ')', 'err');
        }
        done++;
        barFill.style.width = Math.round((done/files.length)*100) + '%';
      }
    }
    await Promise.all(Array.from({length: Math.min(concurrency, files.length)}, worker));
    log(done + '/' + files.length + ' fayl tayyor', 'ok');

    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    const zipFileName = parsed.repo + '-' + branch + '.zip';
    lastZipBlob = blob;
    lastZipName = zipFileName;
    lastZipMeta = { owner: parsed.owner, repo: parsed.repo, branch: branch, fileCount: done, sizeBytes: blob.size };

    dlName.textContent = zipFileName;
    dlSize.textContent = formatSize(blob.size);
    downloadCard.classList.add('show');
    saveRecent(parsed.owner, parsed.repo, 'https://github.com/' + parsed.owner + '/' + parsed.repo);

    log('zip tayyor, pastdagi "Yuklash" tugmasini bosing', 'ok');
    shareBtn.classList.add('show');
  }catch(e){
    log('xato: ' + e.message, 'err');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Download ZIP';
  }
}

document.getElementById('urlInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') startDownload();
});

const CHUNK_SIZE_BYTES = 650000;

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const blockSize = 0x8000;
  for(let i = 0; i < bytes.length; i += blockSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + blockSize));
  }
  return btoa(binary);
}

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function blobToBase64Chunks(blob){
  const buffer = await blob.arrayBuffer();
  const chunks = [];
  for(let offset = 0; offset < buffer.byteLength; offset += CHUNK_SIZE_BYTES){
    chunks.push(arrayBufferToBase64(buffer.slice(offset, offset + CHUNK_SIZE_BYTES)));
  }
  return chunks.length ? chunks : [''];
}

async function uploadForShare(){
  if(!lastZipBlob) return;
  shareBtn.disabled = true;
  shareBtn.textContent = 'yuklanmoqda... 0%';
  shareResult.classList.remove('show');
  barEl.classList.add('show');
  barFill.style.width = '0%';

  try{
    if(!auth.currentUser) await auth.signInAnonymously();

    const chunks = await blobToBase64Chunks(lastZipBlob);
    log(chunks.length + " bo'lak tayyor");

    const docRef = await db.collection('shared_zips').add({
      owner: lastZipMeta.owner,
      repo: lastZipMeta.repo,
      branch: lastZipMeta.branch,
      fileCount: lastZipMeta.fileCount,
      sizeBytes: lastZipMeta.sizeBytes,
      fileName: lastZipName,
      chunkCount: chunks.length,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      downloadCount: 0
    });

    const batchSize = 10;
    let uploaded = 0;
    for(let i = 0; i < chunks.length; i += batchSize){
      const batch = db.batch();
      const slice = chunks.slice(i, i + batchSize);
      slice.forEach((chunkData, j) => {
        batch.set(docRef.collection('chunks').doc(String(i + j)), { data: chunkData });
      });
      await batch.commit();
      uploaded += slice.length;
      const pct = Math.round((uploaded / chunks.length) * 100);
      barFill.style.width = pct + '%';
      shareBtn.textContent = 'yuklanmoqda... ' + pct + '%';
    }

    const shareUrl = location.origin + location.pathname + '?zip=' + docRef.id;
    shareUrlOutput.value = shareUrl;
    shareResult.classList.add('show');
    log('url tayyor', 'ok');
  }catch(e){
    log('xato: ' + e.message, 'err');
  }finally{
    shareBtn.disabled = false;
    shareBtn.textContent = "Ulashish uchun url olish";
  }
}

function copyShareUrl(){
  shareUrlOutput.select();
  navigator.clipboard.writeText(shareUrlOutput.value).then(() => log('nusxalandi', 'ok'));
}

async function downloadSharedZip(docId){
  log('zip qidirilmoqda...');
  try{
    if(!auth.currentUser) await auth.signInAnonymously();

    const docSnap = await db.collection('shared_zips').doc(docId).get();
    if(!docSnap.exists){ log("topilmadi, link eskirgan bo'lishi mumkin", 'err'); return; }
    const meta = docSnap.data();
    log('topildi: ' + meta.owner + '/' + meta.repo, 'ok');

    barEl.classList.add('show');
    const chunksSnap = await docSnap.ref.collection('chunks').get();
    const chunkMap = {};
    chunksSnap.forEach(d => { chunkMap[d.id] = d.data().data; });

    const buffers = [];
    for(let i = 0; i < meta.chunkCount; i++){
      const b64 = chunkMap[String(i)];
      if(!b64) throw new Error(i + "-bo'lak yo'q");
      buffers.push(base64ToArrayBuffer(b64));
      barFill.style.width = Math.round(((i+1)/meta.chunkCount)*100) + '%';
    }

    const blob = new Blob(buffers, { type: 'application/zip' });
    lastZipBlob = blob;
    lastZipName = meta.fileName || (meta.repo + '.zip');
    dlName.textContent = lastZipName;
    dlSize.textContent = formatSize(blob.size);
    downloadCard.classList.add('show');

    let newCount = (meta.downloadCount || 0) + 1;
    try{
      await docSnap.ref.update({ downloadCount: firebase.firestore.FieldValue.increment(1) });
    }catch(e){
      newCount = meta.downloadCount || 0;
    }
    log('bu havola ' + newCount + " marta ochilgan", 'ok');

    log('zip tayyor, pastdagi "Yuklash" tugmasini bosing', 'ok');
  }catch(e){
    log('xato: ' + e.message, 'err');
  }
}

const urlParams = new URLSearchParams(location.search);
const sharedZipId = urlParams.get('zip');
if(sharedZipId){
  document.getElementById('goBtn').style.display = 'none';
  downloadSharedZip(sharedZipId);
}
